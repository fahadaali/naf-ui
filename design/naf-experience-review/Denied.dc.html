<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    /* ══════════════════════════════════════════════════════════════
       رموز ثيم ناف — منسوخة حرفياً من naf-ui/naf-theme.css.
       لا تُقرَّر هنا قيمة: لوحُ التصميم يعمل داخل إطار معزول لا يقرأ
       ورقة أنماط التطبيق، فتُعرَّف الرموز مرّة ثم يُستهلك var() في كل
       ما بعدها — وهي نفس الحجّة التي تُجيز القيم في ملفّات الطباعة.
       ══════════════════════════════════════════════════════════════ */
    .naf {
      --background: oklch(0.9383 0.0042 236.4993);
      --foreground: oklch(0.3211 0 0);
      --card: oklch(1.0000 0 0);
      --card-foreground: oklch(0.3211 0 0);
      --primary: oklch(0.5700 0.0904 80.9413);
      --primary-foreground: oklch(1.0000 0 0);
      --secondary: oklch(0.9670 0.0029 264.5419);
      --secondary-foreground: oklch(0.2972 0.0398 246.6002);
      --muted: oklch(0.9846 0.0017 247.8389);
      --muted-foreground: oklch(0.5250 0.0234 264.3637);
      --accent: oklch(0.9119 0.0222 243.8174);
      --accent-foreground: oklch(0.3791 0.1378 265.5222);
      --destructive: oklch(0.5930 0.2078 25.3313);
      --destructive-foreground: oklch(1.0000 0 0);
      --success: oklch(0.5540 0.1200 155.0000);
      --success-foreground: oklch(1.0000 0 0);
      --warning: oklch(0.5720 0.1400 75.0000);
      --warning-foreground: oklch(1.0000 0 0);
      --info: oklch(0.5640 0.1200 240.0000);
      --info-foreground: oklch(1.0000 0 0);
      --border: oklch(0.8853 0 0);
      --input: oklch(0.9700 0.0029 264.5420);
      --ring: oklch(0.5700 0.0904 80.9413);
      --chart-1: oklch(0.5500 0.1100 80.0000);
      --chart-2: oklch(0.5400 0.1400 240.0000);
      --chart-3: oklch(0.5500 0.1500 155.0000);
      --chart-4: oklch(0.5200 0.1700 300.0000);
      --chart-5: oklch(0.5500 0.1600 20.0000);
      --success-strong: oklch(0.5040 0.1200 155.0000);
      --warning-strong: oklch(0.5220 0.1400 75.0000);
      --destructive-strong: oklch(0.5430 0.2078 25.3313);
      --info-strong: oklch(0.5140 0.1200 240.0000);
      --primary-strong: oklch(0.5200 0.0904 80.9413);
      --highlight: oklch(0.8600 0.2000 102.0000);
      --highlight-foreground: oklch(0.2100 0.0250 262.0000);
      --selection: oklch(0.8300 0.0700 250.0000);
      --selection-foreground: oklch(0.2100 0.0250 262.0000);
      --surface-deep: oklch(0.3451 0.0833 260.8804);
      --surface-deep-foreground: oklch(1.0000 0 0);
      --surface-deep-muted: oklch(0.9119 0.0222 243.8174);
      --shadow-elevated: 0px 18px 50px 0px hsl(0 0% 0% / 0.28);
      --shadow-sm: 0px 1px 3px 0px hsl(0 0% 0% / 0.10), 0px 1px 2px -1px hsl(0 0% 0% / 0.10);
      --shadow-md: 0px 1px 3px 0px hsl(0 0% 0% / 0.10), 0px 2px 4px -1px hsl(0 0% 0% / 0.10);
      --shadow-lg: 0px 1px 3px 0px hsl(0 0% 0% / 0.10), 0px 4px 6px -1px hsl(0 0% 0% / 0.10);
      --overlay: color-mix(in oklab, hsl(0 0% 0%) 60%, transparent);
      --radius: 0.5rem;
      --font-sans: "IBM Plex Sans Arabic", ui-sans-serif, sans-serif, system-ui;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --text-xs: 0.75rem;   --text-xs--line-height: 1.75;
      --text-sm: 0.875rem;  --text-sm--line-height: 1.75;
      --text-base: 1rem;    --text-base--line-height: 1.8;
      --text-lg: 1.125rem;  --text-lg--line-height: 1.75;
      --text-xl: 1.25rem;   --text-xl--line-height: 1.65;
      --text-2xl: 1.5rem;   --text-2xl--line-height: 1.5;
      --text-3xl: 1.875rem; --text-3xl--line-height: 1.4;
      --text-4xl: 2.25rem;  --text-4xl--line-height: 1.3;
      --text-5xl: 3rem;     --text-5xl--line-height: 1.2;
      --spacing: 0.25rem;
      --space-1: calc(var(--spacing) * 1);
      --space-2: calc(var(--spacing) * 2);
      --space-3: calc(var(--spacing) * 3);
      --space-4: calc(var(--spacing) * 4);
      --space-5: calc(var(--spacing) * 5);
      --space-6: calc(var(--spacing) * 6);
      --space-7: calc(var(--spacing) * 7);
      --space-9: calc(var(--spacing) * 9);
      --motion-enter: 240ms;
      --motion-rise: 520ms;
      --motion-breath: 2400ms;
      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* مشتقّة لا مستقلّة — تتبع الوضعين بتعريف واحد */
      --primary-soft: color-mix(in oklab, var(--primary) 14%, var(--card));
      --secondary-soft: color-mix(in oklab, var(--secondary) 14%, var(--card));
      --destructive-soft: color-mix(in oklab, var(--destructive) 14%, var(--card));
      --success-soft: color-mix(in oklab, var(--success) 14%, var(--card));
      --warning-soft: color-mix(in oklab, var(--warning) 14%, var(--card));
      --info-soft: color-mix(in oklab, var(--info) 14%, var(--card));
      --grad-1: linear-gradient(to bottom, var(--chart-1), color-mix(in oklab, var(--chart-1) 45%, var(--surface-deep)));
      --grad-2: linear-gradient(to bottom, var(--chart-2), color-mix(in oklab, var(--chart-2) 45%, var(--surface-deep)));
      --grad-3: linear-gradient(to bottom, var(--chart-3), color-mix(in oklab, var(--chart-3) 45%, var(--surface-deep)));
      --grad-4: linear-gradient(to bottom, var(--chart-4), color-mix(in oklab, var(--chart-4) 45%, var(--surface-deep)));
      --grad-5: linear-gradient(to bottom, var(--chart-5), color-mix(in oklab, var(--chart-5) 45%, var(--surface-deep)));
    }
    .naf.darkmode {
      --background: oklch(0.2598 0.0306 262.6666);
      --foreground: oklch(0.9219 0 0);
      --card: oklch(0.3106 0.0301 268.6365);
      --card-foreground: oklch(0.9219 0 0);
      --primary: oklch(0.7300 0.0904 80.9413);
      --primary-foreground: oklch(0.2100 0.0250 262.0000);
      --secondary: oklch(0.3550 0.0280 265.0000);
      --secondary-foreground: oklch(0.9219 0 0);
      --muted: oklch(0.3095 0.0266 266.7132);
      --muted-foreground: oklch(0.7155 0 0);
      --accent: oklch(0.3380 0.0589 267.5867);
      --accent-foreground: oklch(0.7050 0.0904 80.9413);
      --destructive: oklch(0.7000 0.1900 25.3313);
      --destructive-foreground: oklch(0.2100 0.0250 262.0000);
      --success: oklch(0.7200 0.1300 155.0000);
      --success-foreground: oklch(0.2100 0.0250 262.0000);
      --warning: oklch(0.7800 0.1300 75.0000);
      --warning-foreground: oklch(0.2100 0.0250 262.0000);
      --info: oklch(0.7300 0.1100 240.0000);
      --info-foreground: oklch(0.2100 0.0250 262.0000);
      --success-strong: oklch(0.7300 0.1300 155.0000);
      --warning-strong: oklch(0.7800 0.1300 75.0000);
      --destructive-strong: oklch(0.8050 0.1900 25.3313);
      --info-strong: oklch(0.7400 0.1100 240.0000);
      --primary-strong: oklch(0.7450 0.0904 80.9413);
      --highlight: oklch(0.7800 0.1700 100.0000);
      --highlight-foreground: oklch(0.2100 0.0250 262.0000);
      --selection: oklch(0.4800 0.0800 255.0000);
      --selection-foreground: oklch(0.9700 0 0);
      --border: oklch(0.3843 0.0301 269.7337);
      --input: oklch(0.3843 0.0301 269.7337);
      --ring: oklch(0.7300 0.0904 80.9413);
      --chart-1: oklch(0.6600 0.1100 80.0000);
      --chart-2: oklch(0.6400 0.1400 240.0000);
      --chart-3: oklch(0.6500 0.1500 155.0000);
      --chart-4: oklch(0.6200 0.1600 300.0000);
      --chart-5: oklch(0.6300 0.1500 20.0000);
    }

    body { margin: 0; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary-strong); }
    .naf ::selection { background: var(--selection); color: var(--selection-foreground); }
    .naf { font-family: var(--font-sans); font-size: var(--text-base); line-height: 1.8; }
    .naf { --radius-lg: var(--radius); --radius-2xl: calc(var(--radius) + 10px); }
    /* الشعار له نسخة داكنة — NafLogo يبدّل المصدر مع المظهر */
    .naf.darkmode .b-light { display: none !important; }
    .naf.darkmode .b-dark  { display: block !important; }
    .nafsvg { display: block; height: 100%; width: auto; }
    @keyframes nafspin { to { transform: rotate(360deg); } }
    .spin { animation: nafspin var(--motion-breath) linear infinite; }
  </style>
</helmet>
<div class="naf {{mode}}" dir="rtl" style="width:390px;min-height:844px;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);position:relative;overflow:hidden;">
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-4);">
    <div style="width:100%;max-width:448px;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5);">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);">
        <h1 style="margin:0;font-size:var(--text-base);line-height:var(--text-base--line-height);font-weight:600;"><bdi>الاستبانات</bdi></h1>
        <div role="group" aria-label="المظهر" style="display:flex;gap:2px;background:var(--muted);border-radius:var(--radius-lg);padding:2px;"><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:calc(var(--radius) - 2px);background:var(--card);box-shadow:var(--shadow-sm);"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--foreground);" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" /></svg></span><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:calc(var(--radius) - 2px);"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--muted-foreground);" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg></span><span style="display:grid;place-items:center;width:28px;height:28px;border-radius:calc(var(--radius) - 2px);"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--muted-foreground);" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg></span></div>
      </div>
      <p style="margin:0;display:flex;align-items:flex-start;gap:var(--space-2);font-size:var(--text-sm);line-height:var(--text-sm--line-height);color:var(--muted-foreground);">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--muted-foreground);margin-block-start:4px;" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="9" x2="15" y1="15" y2="9" /></svg><span>صيانة مجدولة حتى نهاية الأسبوع</span></p>
      <div style="display:flex;"><span style="display:inline-flex;align-items:center;justify-content:center;height:36px;padding-inline:var(--space-4);border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);color:var(--foreground);font-size:var(--text-sm);line-height:1;font-weight:500;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--foreground);margin-inline-end:var(--space-2);" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>رجوع</span></div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["الوضع الفاتح","الوضع الداكن"],"default":"الوضع الفاتح","section":"المظهر"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: (this.props.theme ?? 'الوضع الفاتح') === 'الوضع الداكن' ? 'darkmode' : 'lightmode' };
  }
}
</script>
</body>
</html>
